<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#logoGradient)"/>
  
  <!-- Central abstract icon in white -->
  <g transform="translate(100, 100)" fill="white">
    <!-- Central small circle -->
    <circle cx="0" cy="0" r="4" fill="white"/>
    
    <!-- 16 radiating lines with circles at the end -->
    <!-- Top and bottom (vertical) -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="white" stroke-width="1.5"/>
    <circle cx="0" cy="-25" r="6" fill="white"/>
    
    <line x1="0" y1="0" x2="0" y2="25" stroke="white" stroke-width="1.5"/>
    <circle cx="0" cy="25" r="6" fill="white"/>
    
    <!-- Left and right (horizontal) -->
    <line x1="0" y1="0" x2="-25" y2="0" stroke="white" stroke-width="1.5"/>
    <circle cx="-25" cy="0" r="6" fill="white"/>
    
    <line x1="0" y1="0" x2="25" y2="0" stroke="white" stroke-width="1.5"/>
    <circle cx="25" cy="0" r="6" fill="white"/>
    
    <!-- Diagonal lines -->
    <line x1="0" y1="0" x2="-18" y2="-18" stroke="white" stroke-width="1.5"/>
    <circle cx="-18" cy="-18" r="5" fill="white"/>
    
    <line x1="0" y1="0" x2="18" y2="-18" stroke="white" stroke-width="1.5"/>
    <circle cx="18" cy="-18" r="5" fill="white"/>
    
    <line x1="0" y1="0" x2="-18" y2="18" stroke="white" stroke-width="1.5"/>
    <circle cx="-18" cy="18" r="5" fill="white"/>
    
    <line x1="0" y1="0" x2="18" y2="18" stroke="white" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="5" fill="white"/>
    
    <!-- Additional diagonal lines for 16 total -->
    <line x1="0" y1="0" x2="-12" y2="-12" stroke="white" stroke-width="1.2"/>
    <circle cx="-12" cy="-12" r="4" fill="white"/>
    
    <line x1="0" y1="0" x2="12" y2="-12" stroke="white" stroke-width="1.2"/>
    <circle cx="12" cy="-12" r="4" fill="white"/>
    
    <line x1="0" y1="0" x2="-12" y2="12" stroke="white" stroke-width="1.2"/>
    <circle cx="-12" cy="12" r="4" fill="white"/>
    
    <line x1="0" y1="0" x2="12" y2="12" stroke="white" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="4" fill="white"/>
    
    <!-- More lines to complete 16 -->
    <line x1="0" y1="0" x2="-8" y2="-8" stroke="white" stroke-width="1"/>
    <circle cx="-8" cy="-8" r="3" fill="white"/>
    
    <line x1="0" y1="0" x2="8" y2="-8" stroke="white" stroke-width="1"/>
    <circle cx="8" cy="-8" r="3" fill="white"/>
    
    <line x1="0" y1="0" x2="-8" y2="8" stroke="white" stroke-width="1"/>
    <circle cx="-8" cy="8" r="3" fill="white"/>
    
    <line x1="0" y1="0" x2="8" y2="8" stroke="white" stroke-width="1"/>
    <circle cx="8" cy="8" r="3" fill="white"/>
  </g>
</svg>
